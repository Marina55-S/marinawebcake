<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Cakes for All Occasions - Home</title>
    <link rel="stylesheet" href="CSS/styles.css" />
</head>

<body>
    <header>
        <div class="top-bar">
            <a href="index.html" class="logo-area">
                <img src="images/logo.png" alt="Special Cakes for All Occasions logo" />
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="cakes.html">Cakes for Sale</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
        <div class="banner-wrapper">
            <img src="images/banner_contact-us_1200x360x.jpg"
                alt=" Selection of delicious cake and desserts on disply" />
        </div>
    </header>

    <main>
        <h1>Get in touch with us</h1>
        <section class="section-area">
            <p>
                If you have any question about our cakes, catering or special orders, please contact us using the form
                below.
            </p>
        </section>
        <div class="form-inf">
            <section class="section-area">
                <form action="mailto:specialcakes@email.com" method="post" enctype="text/plain">
                    <fieldset>
                        <legend>Contact form</legend>

                        <p>
                            <label for="contact-name">Name</label>
                            <input type="text" id="contact-name" name="Name" required />
                        </p>

                        <p>
                            <label for="contact-email">Email address</label>
                            <input type="email" id="contact-email" name="Email" required />
                        </p>

                        <p>
                            <label for="contact-phone">Phone number</label>
                            <input type="tel" id="contact-phone" name="Phone" required />
                        </p>

                        <p>
                            <label for="contact-message">Question or feedback</label>
                            <textarea id="contact-message" name="Question or feedback" required></textarea>
                        </p>
                    </fieldset>

                    <input type="submit" value="Send message" />
                </form>
            </section>
            <section>
                <img src="images/contact-us_975x750.jpg" alt="contact" width="975px" />
            </section>
        </div>
    </main>

    <footer>
        <p> 2026 Special Cakes for All Occasions. Website Created by Marina Shamoaay </p>
    </footer>

</body>

</html>
